# -----------------------------------------------------------------------
# SentinelX – Application Configuration
# -----------------------------------------------------------------------
# Spring Boot reads this file automatically at startup.
# You can override any value by passing -Dproperty=value on the command
# line, or by setting an environment variable.
# -----------------------------------------------------------------------

server.port=8085

# --- Brute-force login detection rule ----------------------------------
# How many failed logins from the same source IP within the time window
# are needed before an alert is raised.
sentinelx.detection.brute-force.threshold=5

# How many minutes to look back when counting failed logins.
sentinelx.detection.brute-force.window-minutes=10
